<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="description" content="Penaltı Düello — oda lobisi." />
    <title>Oda Lobisi · Penaltı Düello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="js/shared.js" defer></script>
    <script src="js/lobby.js" defer></script>
  </head>
  <body data-page="lobby">
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" aria-busy="true" aria-label="Yükleniyor">
      <div class="loading-screen__content">
        <div class="loading-screen__ball" aria-hidden="true"><img src="assets/clker-free-vector-images-soccer-ball-310065.svg" alt="" draggable="false" /></div>
        <span class="loading-screen__label">YÜKLENİYOR</span>
      </div>
    </div>

    <div class="app-background" aria-hidden="true">
      <div class="background-orb background-orb--green"></div>
      <div class="background-orb background-orb--orange"></div>
      <div class="background-grid"></div>
    </div>

    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="Penaltı Düello ana sayfa">
          <span class="brand-mark" aria-hidden="true"><img class="brand-logo-image" src="assets/occ.png" alt="" /></span>
          <span class="brand-copy brand-copy--visually-hidden"><strong>PENALTI</strong><em>DÜELLO</em></span>
        </a>
        <div class="header-actions">
          <button class="icon-button" id="soundToggle" type="button" aria-label="Sesi aç veya kapat" aria-pressed="true">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4Zm12.2-.8a5.2 5.2 0 0 1 0 6.6M18.8 6a8.8 8.8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M10 9.2 4 9.5v5h3.2l4.3 3.4v-3.8m2.7-4.6a5.2 5.2 0 0 1 .6 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </header>

      <section class="flow-page" aria-labelledby="lobbyTitle">
        <div class="flow-topline">
          <a class="back-link" href="index.html">‹ ANA MENÜ</a>
          <span class="eyebrow" id="lobbyRoomLabel">ODA · ----</span>
        </div>

        <div class="room-panel" id="roomPanel">
          <div class="room-panel-top">
            <div><span class="eyebrow">ÖZEL ODA</span><strong class="room-code-display" id="roomCodeLabel">----</strong></div>
            <button class="copy-button" id="copyCodeButton" type="button"><span>⧉</span> KODU KOPYALA</button>
          </div>
          <div class="room-status-line">
            <span id="roomPlayerCount">0/2 oyuncu</span>
          </div>
        </div>

        <div class="players-card">
          <div class="section-heading">
            <div><span class="eyebrow">ODA LOBİSİ</span><h2 id="lobbyTitle">1v1 Düello</h2></div>
            <span class="player-count" id="lobbyPlayerCount">0/2</span>
          </div>
          <div class="player-slots" id="lobbyPlayerSlots" role="list" aria-label="Oda oyuncuları"></div>
          <div class="ready-bar" id="readyBar"><span class="ready-bar-icon material-symbols-rounded">auto_awesome</span><span id="readyBarText">Oyuncuların bağlanmasını bekle</span></div>
          <button class="ready-button" id="readyButton" type="button" disabled><span class="ready-button-check material-symbols-rounded">check</span><span id="readyButtonLabel">HAZIR OL</span></button>
          <button class="start-button" id="startButton" type="button" disabled>MAÇI BAŞLAT <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></button>
        </div>

        <div class="lobby-page-actions match-footer-row">
          <a class="back-link" href="index.html">Ana Sayfaya Dön</a>
          <span>Oda kodunu arkadaşınla paylaş.</span>
        </div>
      </section>
    </main>
  </body>
</html>
