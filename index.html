<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="description" content="Penaltı Düello — hızlı, mobil ve eğlenceli 1v1 penaltı düellosu." />
    <title>Penaltı Düello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="js/shared.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body data-page="main">
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" aria-busy="true" aria-label="Yükleniyor">
      <div class="loading-screen__content">
        <div class="loading-screen__ball" aria-hidden="true">
          <img src="assets/clker-free-vector-images-soccer-ball-310065.svg" alt="" draggable="false" />
        </div>
        <span class="loading-screen__label">YÜKLENİYOR</span>
      </div>
    </div>

    <div class="app-background" aria-hidden="true">
      <div class="background-orb background-orb--green"></div>
      <div class="background-orb background-orb--orange"></div>
      <div class="background-grid"></div>
    </div>

    <main class="app-shell is-lobby" id="appShell">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="Penaltı Düello ana sayfa" id="brandHome">
          <span class="brand-mark" aria-hidden="true">
            <img class="brand-logo-image" src="assets/occ.png" alt="" />
          </span>
          <span class="brand-copy brand-copy--visually-hidden">
            <strong>PENALTI</strong>
            <em>DÜELLO</em>
          </span>
        </a>
        <div class="header-actions">
          <button class="icon-button" id="soundToggle" type="button" aria-label="Sesi aç veya kapat" aria-pressed="true">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4Zm12.2-.8a5.2 5.2 0 0 1 0 6.6M18.8 6a8.8 8.8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M10 9.2 4 9.5v5h3.2l4.3 3.4v-3.8m2.7-4.6a5.2 5.2 0 0 1 .6 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </header>

      <section class="entry-screen" id="nicknameScreen" hidden>
        <div class="entry-card">
          <span class="eyebrow">OYUNCU PROFİLİ</span>
          <h1>NASIL OYNAYACAKSIN?</h1>
          <p>Rakibinle eğlenceli bir düello için kısa bir isim belirle.</p>
          <form id="nicknameForm" novalidate>
            <label for="nicknameInput">OYUNCU ADIN</label>
            <input id="nicknameInput" name="nickname" type="text" minlength="3" maxlength="16" autocomplete="nickname" placeholder="Örn. Kaptan10" aria-describedby="nicknameError" required />
            <p class="form-hint form-error" id="nicknameError" role="alert" aria-live="polite"></p>
            <button class="confirm-button" id="nicknameSubmit" type="submit">DEVAM ET <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span></button>
          </form>
        </div>
      </section>

      <section class="view view--active main-menu-view" id="mainMenu" hidden aria-label="Ana menü">
        <div class="lobby-hero">
          <img class="hero-art" src="assets/Düelloya.png" alt="Düello'ya Başla" />
        </div>

        <div class="lobby-actions">
          <button class="action-button action-button--primary" id="createRoomButton" type="button">
            <span class="action-button-icon material-symbols-rounded">add</span>
            <span class="action-button__copy"><strong>ODA OLUŞTUR</strong><small> rakibini çağır</small></span>
            <span class="button-arrow material-symbols-rounded">arrow_forward</span>
          </button>
          <button class="action-button action-button--secondary" id="joinRoomButton" type="button">
            <span class="action-button-icon material-symbols-rounded">login</span>
            <span class="action-button__copy"><strong>ODAYA KATIL</strong><small>4 haneli kodu gir</small></span>
            <span class="button-arrow material-symbols-rounded">arrow_forward</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
