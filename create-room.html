<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="description" content="Penaltı Düello — oda oluştur." />
    <title>Oda Oluştur · Penaltı Düello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/shared.js" defer></script>
    <script src="js/create-room.js" defer></script>
  </head>
  <body data-page="create-room">
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite" aria-busy="true" aria-label="Yükleniyor">
      <div class="loading-screen__content">
        <div class="loading-screen__ball" aria-hidden="true"><img src="assets/clker-free-vector-images-soccer-ball-310065.svg" alt="" draggable="false" /></div>
        <span class="loading-screen__label">YÜKLENİYOR</span>
      </div>
    </div>

    <div class="app-background" aria-hidden="true">
      <div class="background-orb background-orb--green"></div>
      <div class="background-orb background-orb--orange"></div>
      <div class="background-grid"></div>
    </div>

    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="Penaltı Düello ana sayfa">
          <span class="brand-mark" aria-hidden="true"><img class="brand-logo-image" src="assets/occ.png" alt="" /></span>
          <span class="brand-copy brand-copy--visually-hidden"><strong>PENALTI</strong><em>DÜELLO</em></span>
        </a>
        <div class="header-actions">
          <button class="icon-button" id="soundToggle" type="button" aria-label="Sesi aç veya kapat" aria-pressed="true">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4Zm12.2-.8a5.2 5.2 0 0 1 0 6.6M18.8 6a8.8 8.8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M10 9.2 4 9.5v5h3.2l4.3 3.4v-3.8m2.7-4.6a5.2 5.2 0 0 1 .6 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </header>

      <section class="flow-page" aria-labelledby="createRoomTitle">
        <div class="flow-topline">
          <a class="back-link" href="index.html">‹ ANA MENÜ</a>
          <span class="eyebrow">ODA OLUŞTUR</span>
        </div>

        <div class="mode-switch create-room-mode" id="createRoomModeSwitch" role="tablist" aria-label="Oyuncu sayısı">
          <button class="mode-button mode-button--active mode-button--duo" type="button" role="tab" aria-selected="true" data-mode="duo">
            <span class="mode-icon mode-icon--duo" aria-hidden="true"></span>
            <span class="mode-button__copy"><strong>1v1 DÜELLO</strong><small>İki dost, tek şampiyon</small></span>
          </button>
          <button class="mode-button mode-button--tournament" type="button" role="tab" aria-selected="false" data-mode="tournament">
            <span class="mode-icon mode-icon--tournament" aria-hidden="true"></span>
            <span class="mode-button__copy"><strong>TURNUVA</strong><small>Üç oyuncu, tek şampiyon</small></span>
          </button>
        </div>

        <div class="players-card flow-card">
          <div class="section-heading">
            <div><span class="eyebrow">YENİ ODA</span><h2 id="createRoomTitle">Oda oluştur</h2></div>
            <span class="player-count" id="createRoomPlayerCount">1/2</span>
          </div>
          <div class="flow-summary">
            <span class="player-avatar material-symbols-rounded" aria-hidden="true">sports_soccer</span>
            <div class="flow-summary__copy"><strong id="createRoomPlayerName">SEN</strong><small>ODA SAHİBİ</small></div>
          </div>
          <p class="form-error" id="createRoomError" role="alert" aria-live="polite"></p>

          <button class="action-button action-button--primary flow-submit" id="createRoomSubmit" type="button">
            <span class="action-button-icon material-symbols-rounded">add</span>
            <span class="action-button__copy"><strong>ODA OLUŞTUR</strong><small>6 haneli kod oluştur</small></span>
            <span class="button-arrow material-symbols-rounded">arrow_forward</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
